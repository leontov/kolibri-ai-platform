name: Apply V3 terminal agent platform wiring

on:
  push:
    branches:
      - factory/v3-terminal-agent-platform

permissions:
  contents: write

concurrency:
  group: apply-v3-terminal-agent-platform
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: factory/v3-terminal-agent-platform
          fetch-depth: 0

      - name: Apply guarded wiring patch
        run: python kolibri-v3/scripts/apply-terminal-agent-platform.py

      - name: Check Python syntax and patch hygiene
        run: |
          set -euo pipefail
          python -m compileall -q \
            kolibri-v3/backend/app/terminal_agent_security.py \
            kolibri-v3/backend/app/machine_skills.py \
            kolibri-v3/backend/app/assistant_catalog.py \
            kolibri-v3/backend/app/terminal_agent_config.py \
            kolibri-v3/backend/app/terminal_agent_registry.py \
            kolibri-v3/backend/app/terminal_provider_execution.py \
            kolibri-v3/backend/app/assistants.py \
            kolibri-v3/backend/tests/test_terminal_agent_platform.py \
            kolibri-v3/backend/app/main.py
          git diff --check

      - name: Commit the guarded wiring result
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kolibri-v3/backend/app/main.py
          git commit -m "feat(v3): wire terminal agent platform into backend"
          git push origin HEAD:factory/v3-terminal-agent-platform
