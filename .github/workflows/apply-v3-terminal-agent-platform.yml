name: Apply V3 terminal agent platform wiring

on:
  push:
    branches:
      - factory/v3-terminal-agent-platform
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: apply-v3-terminal-agent-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply guarded wiring patches
        run: |
          set -euo pipefail
          workflow_copy="$RUNNER_TEMP/kolibri-v3.yml"
          cp .github/workflows/kolibri-v3.yml "$workflow_copy"
          python kolibri-v3/scripts/apply-terminal-agent-platform.py
          python kolibri-v3/scripts/apply-assistant-selection-v2.py
          cp "$workflow_copy" .github/workflows/kolibri-v3.yml
          cd kolibri-v3
          python server/generate_contract_manifest.py

      - name: Check syntax and patch hygiene
        run: |
          set -euo pipefail
          python -m compileall -q \
            kolibri-v3/backend/app/terminal_agent_security.py \
            kolibri-v3/backend/app/machine_skills.py \
            kolibri-v3/backend/app/assistant_catalog.py \
            kolibri-v3/backend/app/assistant_selection.py \
            kolibri-v3/backend/app/terminal_agent_config.py \
            kolibri-v3/backend/app/terminal_agent_registry.py \
            kolibri-v3/backend/app/terminal_provider_execution.py \
            kolibri-v3/backend/app/assistants.py \
            kolibri-v3/backend/tests/test_terminal_agent_platform.py \
            kolibri-v3/backend/tests/test_assistant_selection.py \
            kolibri-v3/backend/app/main.py \
            kolibri-v3/backend/app/chat/models.py \
            kolibri-v3/backend/app/chat/execution_adapter.py \
            kolibri-v3/backend/app/chat/service.py
          find kolibri-v3 -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check

      - name: Commit the guarded wiring result
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(v3): bind dynamic assistants to durable runs"
          git push origin HEAD:factory/v3-terminal-agent-platform
