name: Kolibri V4 Desktop

on:
  pull_request:
    paths:
      - "kolibri-v4/desktop/**"
      - ".github/workflows/kolibri-v4-desktop.yml"
  push:
    branches: [main]
    paths:
      - "kolibri-v4/desktop/**"
      - ".github/workflows/kolibri-v4-desktop.yml"

permissions:
  contents: read

concurrency:
  group: kolibri-v4-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kolibri-v4/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: kolibri-v4/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:sites
