name: Kolibri V3 Primary Inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - fix/v3-portable-release-typescript-install
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  inventory:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Verify trusted Primary runner
        shell: bash
        run: |
          set -euo pipefail
          test "${{ runner.name }}" = "prosmet-primary"
          host="$(hostname -s | tr '[:upper:]' '[:lower:]')"
          case "$host" in
            primary|prosmet-primary|kolibri-primary|*primary*) ;;
            *) echo "Unexpected runner host: $host" >&2; exit 1 ;;
          esac

      - name: Checkout exact V3 PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Collect safe Primary inventory
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/kolibri-primary-inventory.txt"
          host="$(hostname -s | tr '[:upper:]' '[:lower:]')"
          : > "$out"
          {
            echo "inventory_schema=kolibri.primary.inventory.v1"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "runner_name=${RUNNER_NAME:-unknown}"
            echo "hostname=$host"
            echo "user=$(id -un)"
            echo "kernel=$(uname -srmo)"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "[executables]"
            for bin in codex mimocode mimo node python3 rustc cargo; do
              if command -v "$bin" >/dev/null 2>&1; then
                printf '%s=%s\n' "$bin" "$(command -v "$bin")"
              else
                printf '%s=missing\n' "$bin"
              fi
            done
            echo
            echo "[versions]"
            if command -v codex >/dev/null 2>&1; then codex --version 2>&1 | head -n 3 | sed 's/^/codex: /'; fi
            if command -v mimocode >/dev/null 2>&1; then mimocode --version 2>&1 | head -n 3 | sed 's/^/mimocode: /'; fi
            if command -v mimo >/dev/null 2>&1; then mimo --version 2>&1 | head -n 3 | sed 's/^/mimo: /'; fi
            if command -v node >/dev/null 2>&1; then node --version | sed 's/^/node: /'; fi
            if command -v python3 >/dev/null 2>&1; then python3 --version 2>&1 | sed 's/^/python: /'; fi
            if command -v rustc >/dev/null 2>&1; then rustc --version | sed 's/^/rustc: /'; fi
            echo
            echo "[systemd]"
            if command -v systemctl >/dev/null 2>&1; then
              systemctl list-unit-files --type=service --no-legend 2>/dev/null \
                | awk '{print $1}' \
                | grep -E '^(kolibri|codex|mimo)' \
                | sort -u \
                | while read -r unit; do
                    state="$(systemctl is-active "$unit" 2>/dev/null || true)"
                    enabled="$(systemctl is-enabled "$unit" 2>/dev/null || true)"
                    printf '%s active=%s enabled=%s\n' "$unit" "$state" "$enabled"
                  done
            fi
            echo
            echo "[listening-loopback]"
            if command -v ss >/dev/null 2>&1; then
              ss -ltnH 2>/dev/null \
                | awk '$4 ~ /^(127\.0\.0\.1|\[::1\]):/ {print $4}' \
                | sort -u
            fi
            echo
            echo "[skill-names]"
            for root in "$HOME/.codex/skills" "$HOME/.mimo/skills" "$HOME/.config/mimo/skills" "/etc/kolibri/skills" "/opt/kolibri/skills"; do
              if [ -d "$root" ]; then
                find "$root" -type f -name SKILL.md 2>/dev/null \
                  | sed "s#^$root/##" \
                  | sed 's#/SKILL.md$##' \
                  | sort -u \
                  | sed "s#^#$root :: #"
              fi
            done
          } >> "$out"
          sed -E 's#(/home|/root)/[^/ ]+#<home>#g' "$out"

      - name: Upload safe inventory
        uses: actions/upload-artifact@v4
        with:
          name: kolibri-primary-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/kolibri-primary-inventory.txt
          if-no-files-found: error
          retention-days: 7
